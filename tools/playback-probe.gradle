gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('probeOnlinePlayback', JavaExec) {
        dependsOn app.tasks.named('compileDebugUnitTestJavaWithJavac')
        classpath = app.tasks.named('testDebugUnitTest').get().classpath
        mainClass = 'com.vibearc.app.PlaybackProbe'
        args((app.findProperty('probeUrls') ?: 'https://music.youtube.com/watch?v=T6eK-2OQtew').split(','))
        doFirst { app.layout.buildDirectory.file('playback-probe.classpath').get().asFile.text = classpath.asPath }
    }
}
